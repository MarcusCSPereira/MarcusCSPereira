name: Generate contribution graph

on:
  schedule: # every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: generate contribution graph
        run: python .github/scripts/contribution_graph.py
        env:
          GITHUB_USER: MarcusCSPereira
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
